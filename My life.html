<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Life Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/*
  PALITRA (Ishlar uslubi):
  --p1: #edede9  (fon, ekran)
  --p2: #d6ccc2  (sidebar, topbar)
  --p3: #f5ebe0  (karta, modal)
  --p4: #e3d5ca  (hover, field)
  --p5: #d5bdaf  (aksent, badge)
  --accent: #2bb5a5 (teal)
*/

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
*:focus,*:focus-visible,*:focus-within{outline:none !important;box-shadow:none;}
textarea:focus,input:focus,select:focus,button:focus{outline:none !important;}
html,body{
  width:100%;height:100%;
  font-family:'Nunito',sans-serif;
  background:#d6ccc2;
  display:flex;align-items:center;justify-content:center;
}

/* ── DARK MODE ── */
body.dark{background:#0d1b2a;}
body.dark .screen{background:#1b263b;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(119,141,169,.15);}
body.dark .app{background:#162030;}
body.dark .topbar{background:#162030;border-color:rgba(119,141,169,.12);}
body.dark .search-outer{background:#1b263b;box-shadow:inset 2px 2px 5px rgba(0,0,0,.5),inset -1px -1px 3px rgba(119,141,169,.08);}
body.dark .search-outer input{color:#e0e1dd;}
body.dark .search-outer input::placeholder{color:#415a77;}
body.dark .tb-date{color:#778da9;}
body.dark .tb-time{color:#9aadbe;}
body.dark .left{border-color:rgba(119,141,169,.1);}
body.dark .left-title{color:#9aadbe;}
body.dark .tc{background:#1b263b;box-shadow:2px 2px 6px rgba(0,0,0,.4),-1px -1px 3px rgba(119,141,169,.04);}
body.dark .tc:hover{background:#243248;}
body.dark .tc.active{background:linear-gradient(145deg,#33c4b3,#25a090);}
body.dark .tc-name{color:#e0e1dd;}
body.dark .tc.active .tc-name{color:#fff;}
body.dark .tc-badge{background:#0d1b2a;color:#778da9;border-color:rgba(119,141,169,.15);}
body.dark .tc.active .tc-badge{background:rgba(255,255,255,.15);color:#fff;}
body.dark .tc-sub{color:#415a77;}
body.dark .tc.active .tc-sub{color:rgba(255,255,255,.7);}
body.dark .dh-title{color:#e0e1dd;}
body.dark .dh-sub{color:#778da9;}
body.dark .pill{background:#1b263b;color:#9aadbe;}
body.dark .info-box{background:#1b263b;}
body.dark .ib-title{color:#9aadbe;}
body.dark .ib-field{background:#0d1b2a;color:#e0e1dd;box-shadow:inset 2px 2px 5px rgba(0,0,0,.55);}
body.dark .ib-field::placeholder{color:#415a77;}
body.dark .ib-tall{background:#0d1b2a;}
body.dark .files-box{background:#1b263b;}
body.dark .fc-head{background:#0d1b2a;color:#778da9;}
body.dark .fc-file{background:#0d1b2a;color:#c8d5e0;}
body.dark .modal-box{background:#1b263b;}
body.dark .m-title{color:#e0e1dd;}
body.dark .m-inp{background:#0d1b2a;color:#e0e1dd;}
body.dark .m-inp::placeholder{color:#415a77;}
body.dark .m-lbl{color:#778da9;}
body.dark .m-cancel{background:#0d1b2a;color:#778da9;}
body.dark .ctx-menu{background:#1b263b;box-shadow:4px 4px 22px rgba(0,0,0,.6);}
body.dark .ctx-item{color:#c8d5e0;}
body.dark .ctx-item:hover{background:rgba(119,141,169,.1);}
body.dark .ctx-item.danger{color:#e06055;}
body.dark .sb-btn{background:linear-gradient(145deg,#243248,#1b263b);box-shadow:4px 4px 10px rgba(0,0,0,.5),-2px -2px 6px rgba(119,141,169,.08);}
body.dark .sb-btn.sb-active{background:linear-gradient(145deg,#33c4b3,#25a090);}
body.dark .page-card{background:#1b263b;box-shadow:3px 3px 10px rgba(0,0,0,.45),-1px -1px 4px rgba(119,141,169,.06);}
body.dark .task-item{background:#0d1b2a;color:#c8d5e0;box-shadow:1px 1px 5px rgba(0,0,0,.45);}
body.dark .task-item.done{opacity:.5;}
body.dark .task-item:hover{background:#1a2535;}
body.dark .filter-btn{background:#1b263b;color:#778da9;}
body.dark .filter-btn.active{background:linear-gradient(145deg,#33c4b3,#25a090);color:#fff;}
body.dark .month-tab{background:#1b263b;color:#778da9;}
body.dark .month-tab.active{background:linear-gradient(145deg,#33c4b3,#25a090);color:#fff;}
body.dark .stat-card{background:#1b263b;color:#e0e1dd;}
body.dark .stat-card.gold-card{background:linear-gradient(135deg,#b8832a,#d4a030);}
body.dark .goal-card{background:#1b263b;}
body.dark .habit-item{background:#1b263b;}
body.dark .journal-entry{background:#1b263b;}
body.dark .progress-bar-wrap{background:#243248;}
body.dark .wm-day{background:#1b263b;}
body.dark .wm-day.wm-today{background:var(--accent);}
body.dark .add-inp{background:#0d1b2a;color:#e0e1dd;box-shadow:inset 2px 2px 5px rgba(0,0,0,.5);}
body.dark .add-inp::placeholder{color:#415a77;}
body.dark .add-sel{background:#0d1b2a;color:#e0e1dd;}
body.dark .quote-block{background:#0d1b2a;}
body.dark .vision-card{}
body.dark .pomo-section{background:linear-gradient(135deg,#0a0806,#1a1008);}
body.dark .pomo-ring-bg{stroke:rgba(255,255,255,.1)!important;}
body.dark .ico-dark{stroke:#778da9;}

/* ── OUTER SCREEN ── */
.screen{
  width:1380px;height:820px;
  background:#edede9;
  border-radius:26px;
  display:flex;padding:12px 12px 12px 8px;
  box-shadow:0 24px 70px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45);
  position:relative;z-index:1;
}

/* ── SIDEBAR (icon-only, Ishlar style) ── */
.sidebar{
  width:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:10px 0;gap:4px;flex-shrink:0;
}
.sb-btn{
  width:50px;height:50px;border-radius:16px;
  background:linear-gradient(145deg,#f0ece8,#d8cec6);
  box-shadow:5px 5px 12px rgba(0,0,0,.14),-3px -3px 8px rgba(255,255,255,.7);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;font-size:18px;
}
.sb-btn:hover{box-shadow:2px 2px 6px rgba(0,0,0,.1),-1px -1px 4px rgba(255,255,255,.55);transform:scale(.97);}
.sb-btn.sb-active{background:linear-gradient(145deg,#33c4b3,#25a090);box-shadow:4px 4px 10px rgba(0,0,0,.2),-2px -2px 6px rgba(255,255,255,.18);}
.sb-btn .ico-sb{stroke:#8a7060;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;}
.sb-btn.sb-active .ico-sb{stroke:rgba(255,255,255,.95);}
.sb-spacer{height:8px;}
.sb-badge{
  position:absolute;top:-4px;right:-4px;
  width:17px;height:17px;border-radius:50%;
  background:#e04040;color:#fff;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;
}
.sb-btn-wrap{position:relative;}

/* ── APP ── */
.app{
  flex:1;background:#f5ebe0;border-radius:20px;
  display:flex;flex-direction:column;overflow:hidden;
  transition:background .3s;position:relative;
}

/* ── TOPBAR ── */
.topbar{
  height:64px;background:#f5ebe0;display:flex;align-items:center;
  padding:0 20px;flex-shrink:0;
  border-bottom:1px solid rgba(0,0,0,.05);transition:background .3s;
}
.search-outer{
  width:320px;height:42px;background:#edede9;border-radius:13px;
  display:flex;align-items:center;padding:0 14px;gap:10px;
  box-shadow:inset 2px 2px 5px rgba(0,0,0,.08),inset -1px -1px 3px rgba(255,255,255,.7);
}
.search-outer input{flex:1;background:transparent;border:none;outline:none;font-family:'Nunito',sans-serif;font-size:14px;color:#5a4838;}
.search-outer input::placeholder{color:#b8a898;}
.tb-datetime{margin-left:auto;display:flex;align-items:center;gap:14px;}
.tb-date{font-size:17px;font-weight:700;color:#b06838;}
.tb-time{font-size:17px;font-weight:700;color:#7a5e42;min-width:56px;font-family:'JetBrains Mono',monospace;}
.tb-icons{display:flex;align-items:center;gap:8px;margin-left:14px;}
.tbi{border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;}
.tbi-round{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#33c4b3,#25a090);box-shadow:3px 3px 8px rgba(0,0,0,.2),-1px -1px 4px rgba(255,255,255,.18);}
.tbi-round:hover{transform:scale(.94);}

/* sun/moon toggle */
.anim-toggle{cursor:pointer;user-select:none;flex-shrink:0;width:72px;height:36px;position:relative;}
.anim-track{width:100%;height:100%;border-radius:18px;background:linear-gradient(135deg,#87ceeb,#b0dcf0);box-shadow:3px 3px 8px rgba(0,0,0,.18),-1px -1px 4px rgba(255,255,255,.5),inset 0 1px 3px rgba(0,0,0,.08);transition:background .8s ease;overflow:hidden;position:relative;}
body.dark .anim-track{background:linear-gradient(135deg,#0d1b3e,#162540);box-shadow:3px 3px 8px rgba(0,0,0,.55),-1px -1px 4px rgba(119,141,169,.08),inset 0 1px 3px rgba(0,0,0,.3);}
.anim-ts{position:absolute;background:white;border-radius:50%;opacity:0;transition:opacity .7s;}
body.dark .anim-ts{opacity:1;}
.anim-ts1{width:2px;height:2px;top:8px;left:18px;}.anim-ts2{width:1.5px;height:1.5px;top:18px;left:28px;}.anim-ts3{width:2px;height:2px;top:11px;left:33px;}
.anim-knob{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;transition:transform .65s cubic-bezier(.34,1.56,.64,1);}
body.dark .anim-knob{transform:translateX(36px);}
.anim-sun{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9c4,#FFD600 40%,#FF9800 100%);box-shadow:0 0 12px rgba(255,180,0,.7);transition:opacity .4s,transform .5s;opacity:1;transform:scale(1);}
body.dark .anim-sun{opacity:0;transform:scale(.3);}
.anim-moon{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 38%,#f5f5e0,#d8d8b0 55%,#aaa880);box-shadow:0 0 12px rgba(200,200,140,.4);transition:opacity .4s,transform .5s;opacity:0;transform:scale(.3);}
body.dark .anim-moon{opacity:1;transform:scale(1);}
.anim-ray{position:absolute;top:50%;left:50%;width:3px;height:7px;margin-left:-1.5px;margin-top:-3.5px;background:#FFD600;border-radius:2px;transform-origin:center 17px;transition:opacity .4s;}
body.dark .anim-ray{opacity:0;}
.anim-moon-shadow{position:absolute;width:22px;height:22px;background:radial-gradient(circle at 40% 42%,#0d1b3e,transparent 65%);top:3px;left:-2px;border-radius:50%;opacity:.35;}
.anim-crater{position:absolute;background:rgba(0,0,0,.09);border-radius:50%;}
.anim-cr1{width:7px;height:7px;top:5px;left:4px;}.anim-cr2{width:5px;height:5px;top:16px;left:13px;}.anim-cr3{width:4px;height:4px;top:8px;left:16px;}

/* topbar stat chips */
.tb-stats{display:flex;align-items:center;gap:7px;margin-left:16px;flex-shrink:0;}
.tb-stat{display:flex;align-items:center;gap:6px;background:#edede9;border-radius:11px;padding:5px 11px;box-shadow:2px 2px 6px rgba(0,0,0,.08),-1px -1px 3px rgba(255,255,255,.65);}
.tb-stat-val{font-size:13px;font-weight:800;color:#3a2010;}
.tb-stat-lbl{font-size:10px;font-weight:600;color:#9a8878;display:block;margin-top:1px;}
.tb-stat-col{display:flex;flex-direction:column;}
.tb-stat-sep{width:1px;height:22px;background:rgba(0,0,0,.08);margin:0 2px;}
body.dark .tb-stat{background:#1b263b;}
body.dark .tb-stat-val{color:#e0e1dd;}
body.dark .tb-stat-lbl{color:#415a77;}
body.dark .tb-stat-sep{background:rgba(119,141,169,.15);}

/* ── LEFT PANEL ── */
.body{flex:1;display:flex;overflow:hidden;position:relative;}
.left{
  width:270px;flex-shrink:0;padding:10px 10px;
  display:flex;flex-direction:column;gap:3px;
  overflow-y:auto;border-right:1px solid rgba(0,0,0,.05);
}
.left::-webkit-scrollbar{width:0;}
.left-title{font-size:11px;font-weight:700;color:#5a4030;padding:6px 4px 2px;text-transform:uppercase;letter-spacing:.5px;}

/* ── RIGHT PANEL ── */
.right{flex:1;min-width:0;padding:14px 18px 14px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.right::-webkit-scrollbar{width:0;}

/* ── NAV CARDS (tc) ── */
.tc{
  background:#edede9;border-radius:13px;padding:7px 12px;cursor:pointer;
  border:1.5px solid transparent;
  box-shadow:2px 2px 7px rgba(0,0,0,.08),-1px -1px 4px rgba(255,255,255,.7);
  transition:all .15s;display:flex;flex-direction:column;gap:2px;
}
.tc:hover{background:#e3d5ca;}
.tc.active{background:linear-gradient(145deg,#33c4b3,#25a090);box-shadow:2px 2px 8px rgba(43,181,165,.35);}
.tc-row1{display:flex;align-items:center;justify-content:space-between;}
.tc-left2{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.tc-dot{width:8px;height:8px;border-radius:50%;background:#2bb5a5;flex-shrink:0;}
.tc.active .tc-dot{background:#fff;}
.tc-name{font-size:13px;font-weight:800;color:#3a2810;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc.active .tc-name{color:#fff;}
.tc-badge{font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:#d6ccc2;color:#7a6858;border:1px solid rgba(0,0,0,.06);flex-shrink:0;}
.tc.active .tc-badge{background:rgba(255,255,255,.2);color:#fff;border-color:transparent;}
.tc-sub{font-size:10.5px;color:#9a8878;padding-left:16px;}
.tc.active .tc-sub{color:rgba(255,255,255,.75);}
.tc-icon{font-size:15px;flex-shrink:0;}

/* section group label */
.left-group-lbl{font-size:9.5px;font-weight:800;color:#b8a898;text-transform:uppercase;letter-spacing:.8px;padding:4px 4px 2px;margin-top:0;}

/* ── DETAIL HEADER ── */
.dh{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.dh-title{font-size:22px;font-weight:800;color:#2a1800;letter-spacing:.2px;}
.dh-sub{font-size:12px;color:#9a7858;margin-top:2px;}
.dh-right{display:flex;align-items:center;gap:9px;}

/* ── PILL buttons ── */
.pill{border-radius:22px;padding:8px 20px;background:#e3d5ca;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#7a6858;box-shadow:2px 2px 7px rgba(0,0,0,.09),-1px -1px 4px rgba(255,255,255,.6);cursor:pointer;}
.pill:hover{background:#d5bdaf;}
.pill-accent{background:linear-gradient(145deg,#33c4b3,#25a090);color:#fff;box-shadow:2px 2px 8px rgba(0,0,0,.18);}
.pill-accent:hover{background:linear-gradient(145deg,#2eb8a8,#209080);}
.pill-sm{padding:6px 14px;font-size:12px;}
.pill-danger{background:#fce8e6;color:#c04030;}
.pill-danger:hover{background:#f0d0cc;}

/* ── PAGE CARDS ── */
.page-card{background:#edede9;border-radius:16px;padding:16px 18px;box-shadow:3px 3px 12px rgba(0,0,0,.08),-1px -1px 5px rgba(255,255,255,.55);}

/* ── ADD FORM ── */
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.add-inp{
  flex:1;min-width:160px;background:#d6ccc2;border-radius:11px;padding:10px 13px;
  font-size:13px;font-weight:600;color:#3a2810;border:none;outline:none;
  font-family:'Nunito',sans-serif;
  box-shadow:inset 1px 1px 4px rgba(0,0,0,.07),inset -1px -1px 3px rgba(255,255,255,.6);
}
.add-inp::placeholder{color:#b8a898;font-weight:400;}
.add-inp:focus{box-shadow:inset 1px 1px 4px rgba(0,0,0,.09),0 0 0 2px rgba(43,181,165,.2);}
.add-sel{
  background:#d6ccc2;border-radius:11px;padding:10px 12px;
  font-size:12px;font-weight:700;color:#3a2810;border:none;outline:none;
  font-family:'Nunito',sans-serif;cursor:pointer;
  box-shadow:inset 1px 1px 4px rgba(0,0,0,.07),inset -1px -1px 3px rgba(255,255,255,.6);
}
.add-sel:focus{box-shadow:inset 1px 1px 4px rgba(0,0,0,.09),0 0 0 2px rgba(43,181,165,.2);}

/* ── TASK ITEMS ── */
.task-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  background:#d6ccc2;border-radius:12px;cursor:pointer;
  box-shadow:1px 1px 5px rgba(0,0,0,.07),-1px -1px 3px rgba(255,255,255,.6);
  transition:all .15s;position:relative;overflow:hidden;
}
.task-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.task-item.p-yuqori::before{background:#e04040;}
.task-item.p-orta::before{background:#c9943a;}
.task-item.p-past::before{background:#3a9a5a;}
.task-item:hover{box-shadow:2px 2px 9px rgba(0,0,0,.12);}
.task-item.done .t-text{text-decoration:line-through;opacity:.55;}
.task-item.done{opacity:.7;}
.t-text{flex:1;font-size:13px;font-weight:600;color:#3a2810;}
.check-circle{
  width:22px;height:22px;border-radius:50%;border:2px solid #c0b0a0;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#2bb5a5;transition:all .15s;cursor:pointer;
}
.task-item.done .check-circle{background:#2bb5a5;border-color:#2bb5a5;color:#fff;}
.t-del{width:22px;height:22px;border-radius:7px;border:none;background:transparent;cursor:pointer;color:#c0a898;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;}
.t-del:hover{background:rgba(192,64,48,.12);color:#c04030;}
.t-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.b-yuqori{background:#fce8e8;color:#c04030;}
.b-orta{background:#fdf0e0;color:#b07840;}
.b-past{background:#e4f4e8;color:#3a8a4a;}

/* ── PROGRESS BAR ── */
.progress-bar-wrap{background:#d6ccc2;border-radius:100px;height:5px;overflow:hidden;margin-top:6px;box-shadow:inset 1px 1px 3px rgba(0,0,0,.08);}
.progress-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#33c4b3,#2bb5a5);transition:width .6s cubic-bezier(.4,0,.2,1);}

/* stats chips */
.stats-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.chip{background:#d6ccc2;border-radius:100px;padding:3px 10px;font-size:11px;color:#7a6858;border:1px solid rgba(0,0,0,.06);}
.chip strong{color:#3a2810;}

/* ── WEEK MINI ── */
.week-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:4px;}
.wm-day{background:#d6ccc2;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:all .15s;box-shadow:1px 1px 4px rgba(0,0,0,.06),-1px -1px 2px rgba(255,255,255,.6);}
.wm-day:hover{border-color:#2bb5a5;}
.wm-day.wm-today{background:linear-gradient(145deg,#33c4b3,#25a090);color:#fff;}
.wm-day.wm-today .wm-name{color:rgba(255,255,255,.8);}
.wm-day.wm-sel{border-color:#5a4030;background:#c8b8a8;}
.wm-name{font-size:.57rem;color:#9a8878;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.wm-today .wm-name{color:rgba(255,255,255,.8);}
.wm-num{font-size:1.1rem;font-weight:800;margin:1px 0;color:#3a2810;}
.wm-today .wm-num{color:#fff;}
.wm-dot{width:4px;height:4px;border-radius:50%;background:#e04040;margin:2px auto 0;opacity:0;}
.wm-day.wm-has .wm-dot{opacity:1;}

/* ── FILTER BUTTONS ── */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.filter-btn{padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:11.5px;font-weight:700;background:#e3d5ca;color:#7a6858;box-shadow:2px 2px 5px rgba(0,0,0,.08),-1px -1px 3px rgba(255,255,255,.55);transition:all .15s;}
.filter-btn.active{background:linear-gradient(145deg,#33c4b3,#25a090);color:#fff;box-shadow:2px 2px 7px rgba(0,0,0,.14);}
.filter-btn:hover:not(.active){background:#d5bdaf;}

/* ── MONTH TABS ── */
.month-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.month-tab{padding:5px 10px;border-radius:16px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;background:#e3d5ca;color:#7a6858;box-shadow:2px 2px 5px rgba(0,0,0,.07),-1px -1px 3px rgba(255,255,255,.55);transition:all .15s;}
.month-tab.active{background:linear-gradient(145deg,#33c4b3,#25a090);color:#fff;}

/* ── STAT CARDS ── */
.stat-cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.stat-card{background:#edede9;border-radius:14px;padding:14px 16px;box-shadow:3px 3px 10px rgba(0,0,0,.08),-1px -1px 4px rgba(255,255,255,.6);display:flex;flex-direction:column;gap:4px;}
.stat-card.gold-card{background:linear-gradient(135deg,#c9943a,#e0b050);color:#fff;}
.stat-icon{font-size:22px;}
.stat-label{font-size:10px;font-weight:700;color:#9a8878;text-transform:uppercase;letter-spacing:.4px;}
.stat-card.gold-card .stat-label{color:rgba(255,255,255,.7);}
.stat-value{font-size:22px;font-weight:800;color:#2a1800;line-height:1;}
.stat-card.gold-card .stat-value{color:#fff;}
.stat-sub{font-size:10px;color:#b8a898;}
.stat-card.gold-card .stat-sub{color:rgba(255,255,255,.6);}

/* ── GOAL CARDS ── */
.goal-card{background:#edede9;border-radius:14px;padding:14px 16px;box-shadow:2px 2px 8px rgba(0,0,0,.08),-1px -1px 4px rgba(255,255,255,.6);margin-bottom:8px;}
.goal-title{font-size:14px;font-weight:800;color:#2a1800;display:flex;align-items:center;gap:8px;}
.goal-meta{font-size:11px;color:#9a8878;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
.goal-steps{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.step-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#5a4030;cursor:pointer;}
.step-check{width:16px;height:16px;border-radius:5px;border:1.5px solid #c0b0a0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#2bb5a5;}
.step-item.done-step .step-check{background:#2bb5a5;border-color:#2bb5a5;color:#fff;}
.step-item.done-step span{text-decoration:line-through;opacity:.6;}

/* ── HABIT ITEMS ── */
.habit-item{background:#edede9;border-radius:14px;padding:13px 16px;box-shadow:2px 2px 8px rgba(0,0,0,.08),-1px -1px 4px rgba(255,255,255,.6);margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.habit-streak{font-size:11px;font-weight:700;color:#e04040;background:#fce8e8;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.habit-days{display:flex;gap:4px;margin-left:auto;}
.habit-day{width:26px;height:26px;border-radius:8px;border:1.5px solid #d5bdaf;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#9a8878;cursor:pointer;transition:all .15s;}
.habit-day.done{background:linear-gradient(145deg,#33c4b3,#25a090);border-color:transparent;color:#fff;}

/* ── JOURNAL ── */
.journal-entry{background:#edede9;border-radius:14px;padding:14px 16px;box-shadow:2px 2px 8px rgba(0,0,0,.08),-1px -1px 4px rgba(255,255,255,.6);margin-bottom:8px;position:relative;}
.j-date{font-size:11px;color:#9a8878;font-weight:600;}
.j-mood{font-size:16px;}
.j-preview{font-size:13px;color:#4a3020;line-height:1.55;margin-top:5px;}
.j-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.j-tag{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;background:#d6ccc2;color:#7a6858;}

/* ── VISION GRID ── */
.vision-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.vision-card{border-radius:16px;overflow:hidden;aspect-ratio:3/2;position:relative;cursor:pointer;box-shadow:3px 3px 12px rgba(0,0,0,.12),-1px -1px 4px rgba(255,255,255,.55);transition:transform .15s;}
.vision-card:hover{transform:translateY(-3px);}
.vision-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;}
.vision-overlay{position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.7));display:flex;flex-direction:column;justify-content:flex-end;padding:12px;}
.vision-title{font-size:13px;font-weight:800;color:#fff;}
.vision-cat{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px;}
.vision-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;background:rgba(200,60,50,.8);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
.vision-card:hover .vision-del{opacity:1;}

/* ── QUOTE BLOCK ── */
.quote-block{background:#2a1800;border-radius:16px;padding:20px 24px;position:relative;overflow:hidden;margin-bottom:4px;}
.quote-text{font-size:14px;font-style:italic;color:rgba(255,255,255,.85);line-height:1.65;font-weight:600;}
.quote-author{font-size:11px;font-weight:800;color:#c9943a;letter-spacing:.1em;margin-top:8px;}

/* ── DASHBOARD GRID ── */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.dash-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.dash-section-title{font-size:12px;font-weight:800;color:#7a6858;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.dash-section-title::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.07);}

/* ── POMODORO ── */
.pomo-section{background:linear-gradient(135deg,#1a0e05,#2a1808);border-radius:18px;padding:20px 24px;margin-bottom:4px;}
.pomo-inner{display:flex;align-items:center;gap:24px;}
.pomo-ring-wrap{position:relative;width:140px;height:140px;flex-shrink:0;}
.pomo-ring-wrap svg{width:140px;height:140px;}
.pomo-ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:8;}
.pomo-ring-fill{fill:none;stroke:#e84a2e;stroke-width:8;stroke-linecap:round;stroke-dasharray:376;stroke-dashoffset:0;transition:stroke-dashoffset .5s,stroke .3s;transform:rotate(-90deg);transform-origin:70px 70px;}
.pomo-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pomo-time-display{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px;}
.pomo-mode-label{font-size:8px;font-weight:800;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.pomo-right{flex:1;display:flex;flex-direction:column;gap:10px;}
.pomo-task-name{font-size:15px;font-weight:800;color:#fff;line-height:1.2;}
.pomo-task-sub{font-size:11px;color:rgba(255,255,255,.4);}
.pomo-controls{display:flex;gap:8px;}
.pomo-btn{padding:9px 18px;border-radius:11px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;transition:all .15s;}
.pomo-btn-start{background:linear-gradient(145deg,#e84a2e,#c73a20);color:#fff;box-shadow:2px 2px 8px rgba(0,0,0,.25);}
.pomo-btn-start:hover{transform:scale(.97);}
.pomo-btn-ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);}
.pomo-btn-ghost:hover{background:rgba(255,255,255,.2);}
.pomo-dots{display:flex;gap:6px;}
.pomo-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15);}
.pomo-dot.done{background:#e84a2e;}
.pomo-count-row{display:flex;align-items:center;gap:10px;font-size:11px;color:rgba(255,255,255,.5);}
.pomo-count-row span{color:rgba(255,255,255,.75);}
.pomo-settings{display:flex;gap:10px;font-size:11px;color:rgba(255,255,255,.5);}
.pomo-settings input[type=number]{width:40px;background:rgba(255,255,255,.1);border:none;border-radius:6px;padding:3px 6px;color:#fff;font-family:'Nunito',sans-serif;font-size:11px;text-align:center;}

/* ── MODAL ── */
.mbg{position:fixed;inset:0;background:rgba(13,27,42,.88);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.mbg.open{opacity:1;pointer-events:all;}
.modal-box{background:#f5ebe0;border-radius:22px;padding:26px 28px 22px;width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:6px 6px 26px rgba(0,0,0,.2),-2px -2px 8px rgba(255,255,255,.55);transform:scale(.95) translateY(10px);transition:transform .2s;}
.mbg.open .modal-box{transform:scale(1) translateY(0);}
.m-title{font-size:17px;font-weight:800;color:#3a2010;margin-bottom:16px;}
.m-lbl{font-size:10.5px;font-weight:700;color:#8a7060;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block;}
.m-inp{width:100%;background:#e3d5ca;border-radius:11px;border:none;padding:10px 13px;font-family:'Nunito',sans-serif;font-size:13px;color:#3a2010;outline:none;box-shadow:inset 2px 2px 5px rgba(0,0,0,.07),inset -1px -1px 3px rgba(255,255,255,.6);margin-bottom:10px;}
.m-inp:focus{box-shadow:inset 2px 2px 5px rgba(0,0,0,.09),0 0 0 2px rgba(43,181,165,.25);}
.m-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.m-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.m-btns{display:flex;gap:10px;margin-top:8px;}
.m-ok{flex:1;padding:11px;background:linear-gradient(145deg,#33c4b3,#25a090);color:#fff;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:2px 2px 8px rgba(0,0,0,.18);}
.m-ok:hover{transform:scale(.97);}
.m-cancel{flex:1;padding:11px;background:#d6ccc2;color:#7a6858;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.m-cancel:hover{color:#3a2010;}
.m-group{margin-bottom:10px;}

/* ── NOTIFY ── */
#notif{position:fixed;top:16px;right:16px;z-index:9999;background:#f5ebe0;border-radius:16px;padding:12px 18px;box-shadow:4px 4px 20px rgba(0,0,0,.2),-1px -1px 5px rgba(255,255,255,.55);display:flex;align-items:center;gap:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#3a2010;opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none;}
#notif.show{opacity:1;transform:translateY(0);}
body.dark #notif{background:#1b263b;color:#e0e1dd;}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:#b8a898;text-align:center;gap:8px;}
.e-icon{font-size:32px;}
.empty p{font-size:13px;font-weight:600;}

/* AI page */
.ai-btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.ai-result-box{background:#d6ccc2;border-radius:13px;padding:14px;font-size:13px;line-height:1.7;color:#3a2010;min-height:60px;box-shadow:inset 1px 1px 4px rgba(0,0,0,.07);}
body.dark .ai-result-box{background:#0d1b2a;color:#c8d5e0;}

/* Yillik calendar */
.ycal-months{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
.ycal-month{font-size:10px;}
.ycal-month-name{font-weight:800;color:#5a4030;margin-bottom:5px;letter-spacing:.3px;}
.ycal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.ycal-day{width:100%;aspect-ratio:1;border-radius:3px;background:#e3d5ca;cursor:default;font-size:8px;display:flex;align-items:center;justify-content:center;color:#b8a898;}
.ycal-day.yd-has{background:rgba(43,181,165,.4);color:#1a7060;}
.ycal-day.yd-today{background:#e84a2e!important;color:#fff;}
.ycal-day.yd-range{background:rgba(201,148,58,.4);color:#7a4a10;}
body.dark .ycal-month-name{color:#9aadbe;}
body.dark .ycal-day{background:#243248;color:#415a77;}
body.dark .ycal-day.yd-has{background:rgba(43,181,165,.3);color:#2bb5a5;}

@keyframes si{from{opacity:0;transform:translateX(-5px);}to{opacity:1;transform:translateX(0);}}
.tc{animation:si .2s ease both;}
.tc:nth-child(1){animation-delay:.03s}.tc:nth-child(2){animation-delay:.06s}.tc:nth-child(3){animation-delay:.09s}.tc:nth-child(4){animation-delay:.12s}.tc:nth-child(5){animation-delay:.15s}.tc:nth-child(6){animation-delay:.18s}
</style>
</head>

<script>
// ============================================================
// MY LIFE PLAN — Ishlar dizayni bilan qayta yozilgan
// ============================================================

var NOW = new Date();
var OY = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
var KUN = ['Yak','Du','Se','Cho','Pay','Ju','Sha'];
var KUN_FULL = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

var DEFAULT_QUOTES = [
  {t:"Katta orzular ko'ring. Kichik boshlang. Hozir harakat qiling.", a:'ROBIN SHARMA'},
  {t:"Muvaffaqiyat tasodif emas — bu qattiq mehnat va bag'rikenglik.", a:'COLIN POWELL'},
  {t:"Har bir kun — yangi imkoniyat. Undan foydalaning.", a:'MARK TWAIN'},
  {t:"O'zingizga ishoning. Siz o'ylayotganingizdan kuchliroqsiz.", a:'T.D. JAKES'},
  {t:"Kelajak bugun nima qilayotganingizga bog'liq.", a:'GANDHI'},
  {t:"Eng yaxshi vaqt — hozir.", a:'XITOY MAQOLI'},
  {t:"Muvaffaqiyat — bu yo'nalish, natija emas.", a:'RICHARD BACH'},
  {t:"Har bir katta yutuq — bir qator kichik qarorlardan iborat.", a:"NOMA'LUM"}
];

// ── STORAGE ──
function ld(k){ try{ return JSON.parse(localStorage.getItem('mlp2_'+k)||'[]'); }catch(e){ return []; } }
function ldo(k){ try{ return JSON.parse(localStorage.getItem('mlp2_'+k)||'{}'); }catch(e){ return {}; } }
function sv(k,v){ localStorage.setItem('mlp2_'+k, JSON.stringify(v)); }
function getQuotes(){ try{ var q=JSON.parse(localStorage.getItem('mlp_quotes')||'null'); return (q&&q.length)?q:DEFAULT_QUOTES; }catch(e){ return DEFAULT_QUOTES; } }
function saveQuotes(q){ localStorage.setItem('mlp_quotes', JSON.stringify(q)); }
function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt2(n){ return String(Math.floor(n)).padStart(2,'0'); }
function dKey(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function wKey(d){ var j=new Date(d.getFullYear(),0,1); return d.getFullYear()+'-W'+Math.ceil(((d-j)/864e5+j.getDay()+1)/7); }

// ── DATA ──
var D = {
  kunlik: ldo('kunlik'), haftalik: ldo('haftalik'),
  oylik: ldo('oylik'), yillik: ldo('yillik'),
  goals: ld('goals'), habits: ld('habits'),
  habitLog: ldo('habitLog'), journal: ld('journal'),
  vision: ld('vision')
};

var SEL = {
  kunlik: dKey(NOW), kFilter: 'barchasi',
  haftalik: { dk: dKey(NOW), day: NOW.getDay(), week: wKey(NOW) },
  oylik: { y: NOW.getFullYear(), m: NOW.getMonth() },
  yillik: { y: NOW.getFullYear(), m: NOW.getMonth() },
  gFilter: 'barchasi',
  page: 'dashboard'
};

// ── POMODORO ──
var POMO = {
  running:false, interval:null, mode:'work', session:1, totalDone:0,
  secsLeft:25*60, totalSecs:25*60, taskId:null, taskName:'Vazifa tanlanmagan',
  workMin:25, breakMin:5, longMin:15
};

// ── QUOTES ──
var QUOTES = getQuotes();
var quoteIdx = Math.floor(Math.random() * QUOTES.length);
var quoteTimerInterval = null;
var quoteTimerSecs = 300;
var quoteTimerMax = 300;

// ── MISC ──
var vmColor = '#1a0f0a';
var aiCache = {};

// ============================================================
// INIT
// ============================================================
document.addEventListener("DOMContentLoaded", function(){
  updateClock(); setInterval(updateClock, 1000);
  initTheme();
  showQuote(quoteIdx); startQuoteTimer();
  syncHaftalikToKunlik();
  sbNav('dashboard');
  initVisionColors();
});

function syncHaftalikToKunlik(){
  var todayDk = dKey(NOW);
  var todayDayIdx = NOW.getDay();
  var todayWeek = wKey(NOW);
  var key = todayWeek+'-'+todayDayIdx;
  var hTasks = D.haftalik[key]||[];
  if(!hTasks.length) return;
  if(!D.kunlik[todayDk]) D.kunlik[todayDk]=[];
  var existingIds = D.kunlik[todayDk].map(function(t){ return t.id; });
  var added = false;
  hTasks.forEach(function(ht){
    if(existingIds.indexOf(ht.id)===-1){
      D.kunlik[todayDk].push({id:ht.id,text:ht.text,priority:ht.priority,deadline:ht.deadline||'',time:'',done:ht.done,pomos:0,fromHaftalik:true});
      added = true;
    }
  });
  if(added){ sv('kunlik',D.kunlik); }
}

// ── CLOCK ──
function updateClock(){
  var n=new Date();
  var dateEl=document.getElementById('topDate');
  var timeEl=document.getElementById('topTime');
  if(dateEl) dateEl.textContent = n.getDate()+' '+OY[n.getMonth()].toUpperCase();
  if(timeEl) timeEl.textContent = fmt2(n.getHours())+':'+fmt2(n.getMinutes());
  updateTopStats();
}

function updateTopStats(){
  var todayDk = dKey(NOW);
  var todayT = D.kunlik[todayDk]||[];
  var done = todayT.filter(function(t){ return t.done; }).length;
  var pct = todayT.length ? Math.round(done/todayT.length*100) : 0;
  var el1=document.getElementById('stat-today'); if(el1) el1.textContent=todayT.length;
  var el2=document.getElementById('stat-done'); if(el2) el2.textContent=pct+'%';
  var maxStreak=0;
  D.habits.forEach(function(h){ if(h.streak>maxStreak) maxStreak=h.streak; });
  var el3=document.getElementById('stat-streak'); if(el3) el3.textContent=maxStreak+'🔥';
  var nbk=document.getElementById('sb-badge-k');
  var active=todayT.filter(function(t){ return !t.done; }).length;
  if(nbk){ nbk.style.display=active?'flex':'none'; nbk.textContent=active; }
}

// ── THEME ──
function toggleDark(){
  var dark=document.body.classList.toggle('dark');
  localStorage.setItem('mlp_theme', dark?'dark':'light');
}
function initTheme(){
  if(localStorage.getItem('mlp_theme')==='dark') document.body.classList.add('dark');
}

// ── SEARCH ──
function filterSearch(v){
  // basic highlight - just re-render with filter
}

// ============================================================
// SIDEBAR NAVIGATION (Ishlar style: icon click → render left+right)
// ============================================================
var NAV_PAGES = [
  {id:'dashboard', icon:'⊞', label:'Dashboard', group:'Asosiy'},
  {id:'kunlik', icon:'☀️', label:'Kunlik', group:'Vazifalar'},
  {id:'haftalik', icon:'📅', label:'Haftalik', group:'Vazifalar'},
  {id:'oylik', icon:'🗓️', label:'Oylik', group:'Vazifalar'},
  {id:'yillik', icon:'🌟', label:'Yillik', group:'Vazifalar'},
  {id:'goals', icon:'🎯', label:'Maqsadlar', group:'Hayot'},
  {id:'habits', icon:'🔥', label:'Odatlar', group:'Hayot'},
  {id:'journal', icon:'📖', label:'Kundalik', group:'Hayot'},
  {id:'vision', icon:'✨', label:'Vision Board', group:'Hayot'},
  {id:'stats', icon:'📊', label:'Statistika', group:'Boshqa'},
  {id:'ai', icon:'🤖', label:'AI Tahlil', group:'Boshqa'},
];

function sbNav(page){
  SEL.page = page;
  // Update sidebar active
  NAV_PAGES.forEach(function(p){
    var btn=document.getElementById('sb-'+p.id);
    if(btn){ btn.classList.toggle('sb-active', p.id===page); }
  });
  renderLeft(page);
  renderRight(page);
}

// ── LEFT PANEL ──
function renderLeft(page){
  var left=document.getElementById('leftPanel');
  left.innerHTML='';

  if(page==='dashboard'){
    // Title + date
    var dtDiv=document.createElement('div');
    dtDiv.innerHTML='<div class="left-title">📅 '+KUN_FULL[NOW.getDay()]+'</div>'+
      '<div style="font-size:28px;font-weight:800;color:#b06838;">'+NOW.getDate()+' '+OY[NOW.getMonth()]+'</div>'+
      '<div style="font-size:11px;color:#9a8878;">'+NOW.getFullYear()+' yil</div>';
    left.appendChild(dtDiv);

    // Quote
    var q=QUOTES[quoteIdx]||QUOTES[0];
    var qDiv=document.createElement('div');
    qDiv.className='quote-block'; qDiv.style.cursor='pointer';
    qDiv.id='left-quote';
    qDiv.onclick=function(){ openModal('quote-modal'); };
    qDiv.innerHTML='<div class="quote-text">"'+escH(q.t)+'"</div>'+
      '<div class="quote-author">— '+escH(q.a)+'</div>'+
      '<div id="q-timer-bar" style="position:absolute;bottom:0;left:0;height:3px;background:rgba(201,148,58,.6);border-radius:0 3px 3px 0;width:100%;transition:width linear"></div>';
    left.appendChild(qDiv);

    // Ring + stats
    var todayDk=dKey(NOW);
    var todayT=D.kunlik[todayDk]||[];
    var done=todayT.filter(function(t){ return t.done; }).length;
    var pct=todayT.length?Math.round(done/todayT.length*100):0;
    var stroke=125.7*(1-pct/100);
    var ringDiv=document.createElement('div');
    ringDiv.style.cssText='display:flex;align-items:center;gap:12px;';
    ringDiv.innerHTML='<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="20" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="4"/><circle id="ring-circle" cx="26" cy="26" r="20" fill="none" stroke="#2bb5a5" stroke-width="4" stroke-dasharray="125.7" stroke-dashoffset="'+stroke+'" stroke-linecap="round" transform="rotate(-90 26 26)" style="transition:stroke-dashoffset .8s ease"/></svg>'+
      '<div><div style="font-size:20px;font-weight:800;color:#2bb5a5;">'+pct+'%</div><div style="font-size:11px;color:#9a8878;">Bugungi bajarildi</div></div>';
    left.appendChild(ringDiv);

    // Nav links
    var groups = {};
    NAV_PAGES.forEach(function(p){
      if(p.id==='dashboard') return;
      if(!groups[p.group]) groups[p.group]=[];
      groups[p.group].push(p);
    });
    Object.keys(groups).forEach(function(grp){
      var lbl=document.createElement('div');
      lbl.className='left-group-lbl';
      lbl.textContent=grp;
      left.appendChild(lbl);
      groups[grp].forEach(function(p){
        var el=document.createElement('div');
        el.className='tc'+(SEL.page===p.id?' active':'');
        el.innerHTML='<div class="tc-row1"><div class="tc-left2"><span class="tc-icon">'+p.icon+'</span><span class="tc-name">'+p.label+'</span></div></div>';
        el.onclick=function(){ sbNav(p.id); };
        left.appendChild(el);
      });
    });
    return;
  }

  // For all other pages: show relevant sub-nav items
  var todayDk=dKey(NOW);
  var todayT=D.kunlik[todayDk]||[];
  var done=todayT.filter(function(t){ return t.done; }).length;
  var pct=todayT.length?Math.round(done/todayT.length*100):0;

  // Page title in left
  var cur=NAV_PAGES.find(function(p){ return p.id===page; });
  if(cur) left.innerHTML='<div class="left-title" style="margin-bottom:10px;">'+cur.icon+' '+cur.label+'</div>';

  if(page==='kunlik'){
    // Week mini in left
    left.innerHTML+='<div style="font-size:11px;font-weight:700;color:#9a8878;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;">Hafta</div>';
    var weekDiv=document.createElement('div');
    left.appendChild(weekDiv);

  else if(page==='yillik'){

// ── RIGHT PANEL RENDER ──
function renderRight(page){
  var right=document.getElementById('rightContent');
  right.innerHTML='';

  if(page==='dashboard') renderDashboardRight(right);
  else if(page==='kunlik') renderKunlikRight(right);
  else if(page==='haftalik') renderHaftalikRight(right);
  else if(page==='oylik') renderOylikRight(right);
  else if(page==='yillik') renderYillikRight(right);
  else if(page==='goals') renderGoalsRight(right);
  else if(page==='habits') renderHabitsRight(right);
  else if(page==='journal') renderJournalRight(right);
  else if(page==='vision') renderVisionRight(right);
  else if(page==='stats') renderStatsRight(right);
  else if(page==='ai') renderAiRight(right);
}

function renderTaskItem(t,scope,key){
  var item=document.createElement('div');
  item.className='task-item p-'+t.priority+(t.done?' done':'');
  item.style.marginBottom='6px';

  var pomoBtn='';
  if(scope==='kunlik'){
    pomoBtn='<button style="background:rgba(232,74,46,.12);border:none;border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;color:#e84a2e;font-weight:700;" onclick="event.stopPropagation();pomoSelectTask('+t.id+',\''+escH(t.text)+'\')">🍅'+(t.pomos||0)+'</button>';
  }

  var deadlineHtml='';
  if(t.deadline){ deadlineHtml='<span style="font-size:10px;color:#9a8878;background:#e3d5ca;padding:2px 7px;border-radius:20px;flex-shrink:0;">📅 '+t.deadline+'</span>'; }

  item.innerHTML=
    '<div class="check-circle">'+(t.done?'✓':'')+'</div>'+
    '<div class="t-text">'+escH(t.text)+'</div>'+
    deadlineHtml+
    '<span class="t-badge b-'+t.priority+'">'+(t.priority==='yuqori'?'Yuqori':t.priority==='orta'?"O'rta":'Past')+'</span>'+
    pomoBtn+
    '<button class="t-del" onclick="event.stopPropagation();deleteT(\''+scope+'\',\''+key+'\','+t.id+')">✕</button>';

  item.querySelector('.check-circle').addEventListener('click', function(e){
    e.stopPropagation();
    toggleT(scope,key,t.id);
  });
  return item;
}

function changeGoalProgress(id,delta){
  var g=D.goals.find(function(x){ return x.id===id; }); if(!g) return;
  g.progress=Math.max(0,Math.min(100,(g.progress||0)+delta));
  sv('goals',D.goals); renderLeft('goals'); renderRight('goals');
}
function toggleGoalStep(gid,si){
  var g=D.goals.find(function(x){ return x.id===gid; }); if(!g||!g.steps) return;
  g.steps[si].done=!g.steps[si].done;
  var done=g.steps.filter(function(s){ return s.done; }).length;
  g.progress=Math.round(done/g.steps.length*100);
  sv('goals',D.goals); renderLeft('goals'); renderRight('goals');
}
function deleteGoal(id){ D.goals=D.goals.filter(function(x){ return x.id!==id; }); sv('goals',D.goals); renderLeft('goals'); renderRight('goals'); notify('Maqsad o\'chirildi'); }

function toggleHabit(hid, dk){
  var h=D.habits.find(function(x){ return x.id===hid; }); if(!h) return;
  if(!D.habitLog[hid]) D.habitLog[hid]={};
  var wasDone=D.habitLog[hid][dk];
  D.habitLog[hid][dk]=!wasDone;
  if(!wasDone) h.streak=(h.streak||0)+1;
  else h.streak=Math.max(0,(h.streak||0)-1);
  sv('habitLog',D.habitLog); sv('habits',D.habits);
  if(SEL.page==='habits'){ renderLeft('habits'); renderRight('habits'); }
  else if(SEL.page==='dashboard'){ renderLeft('dashboard'); renderRight('dashboard'); }
  else { updateTopStats(); }
  notify(wasDone?'Odat bekor qilindi':'Odat bajarildi! 🔥');
}

// TASK OPERATIONS
// ============================================================
function toggleT(scope,key,id){
  if(!D[scope][key]) return;
  var t=D[scope][key].find(function(x){ return x.id==id; }); if(!t) return;
  t.done=!t.done;
  sv(scope,D[scope]);
  if(scope==='kunlik'){
    Object.keys(D.haftalik).forEach(function(hk){ var ht=D.haftalik[hk].find(function(x){ return x.id==id; }); if(ht) ht.done=t.done; });
    sv('haftalik',D.haftalik);
  }
  if(scope==='haftalik'){
    Object.keys(D.kunlik).forEach(function(kk){ var kt=D.kunlik[kk].find(function(x){ return x.id==id; }); if(kt) kt.done=t.done; });
    sv('kunlik',D.kunlik);
  }
  renderLeft(SEL.page); renderRight(SEL.page);
}

function deleteT(scope,key,id){
  if(!D[scope][key]) return;
  D[scope][key]=D[scope][key].filter(function(x){ return x.id!=id; });
  sv(scope,D[scope]);
  renderLeft(SEL.page); renderRight(SEL.page);
  notify('Vazifa o\'chirildi');
}

function pomoStartStop(){
  if(POMO.running){ clearInterval(POMO.interval); POMO.running=false; }
  else {
    POMO.running=true;
    POMO.interval=setInterval(function(){
      POMO.secsLeft--;
      updatePomoUI();
      if(POMO.secsLeft<=0){
        clearInterval(POMO.interval); POMO.running=false;
        if(POMO.mode==='work'){
          POMO.totalDone++; POMO.session++;
          if(POMO.session>4){ POMO.session=1; POMO.mode='longBreak'; POMO.secsLeft=POMO.longMin*60; }
          else { POMO.mode='break'; POMO.secsLeft=POMO.breakMin*60; }
        } else { POMO.mode='work'; POMO.secsLeft=POMO.workMin*60; }
        POMO.totalSecs=POMO.secsLeft;
        notify(POMO.mode==='work'?'Dam olish tugadi! 🍅':'Ishlash vaqti! 💪');
        updatePomoUI();
      }
    },1000);
  }
  updatePomoUI();
}
function pomoReset(){ clearInterval(POMO.interval); POMO.running=false; POMO.mode='work'; POMO.secsLeft=POMO.workMin*60; POMO.totalSecs=POMO.workMin*60; updatePomoUI(); }
function pomoSkip(){ clearInterval(POMO.interval); POMO.running=false; if(POMO.mode==='work'){ POMO.totalDone++; POMO.session++; if(POMO.session>4){ POMO.session=1; POMO.mode='longBreak'; POMO.secsLeft=POMO.longMin*60; } else { POMO.mode='break'; POMO.secsLeft=POMO.breakMin*60; } } else { POMO.mode='work'; POMO.secsLeft=POMO.workMin*60; } POMO.totalSecs=POMO.secsLeft; updatePomoUI(); }
function pomoResetTotal(){ POMO.totalDone=0; POMO.session=1; updatePomoUI(); }
function pomoUpdateSettings(){
  var wm=document.getElementById('pomo-work-min'), bm=document.getElementById('pomo-break-min'), lm=document.getElementById('pomo-long-min');
  if(wm) POMO.workMin=parseInt(wm.value)||25;
  if(bm) POMO.breakMin=parseInt(bm.value)||5;
  if(lm) POMO.longMin=parseInt(lm.value)||15;
  if(!POMO.running){ POMO.secsLeft=POMO.workMin*60; POMO.totalSecs=POMO.workMin*60; updatePomoUI(); }
}
function pomoSelectTask(id,name){ POMO.taskId=id; POMO.taskName=name; updatePomoUI(); notify('Vazifa tanlandi: '+name,'🍅'); }
function updatePomoUI(){
  var disp=document.getElementById('pomo-display');
  var lbl=document.getElementById('pomo-mode-label');
  var btn=document.getElementById('pomo-start-btn');
  var dots=document.getElementById('pomo-dots');
  var sess=document.getElementById('pomo-session');
  var tot=document.getElementById('pomo-total');
  var tname=document.getElementById('pomo-task-name');
  var ring=document.getElementById('pomo-ring');
  var mins=Math.floor(POMO.secsLeft/60), secs=POMO.secsLeft%60;
  if(disp) disp.textContent=fmt2(mins)+':'+fmt2(secs);
  if(lbl) lbl.textContent={work:'ISHLASH',break:'DAM OLISH',longBreak:'UZUN DAM'}[POMO.mode]||'';
  if(btn) btn.textContent=POMO.running?'⏸ To\'xtat':'▶ Boshlash';
  if(sess) sess.textContent=POMO.session;
  if(tot) tot.textContent=POMO.totalDone;
  if(tname) tname.textContent=POMO.taskName;
  if(dots){ dots.innerHTML=''; for(var i=0;i<4;i++){ var d=document.createElement('div'); d.className='pomo-dot'+(i<POMO.session-1?' done':''); dots.appendChild(d); } }
  if(ring){ var perc=POMO.totalSecs>0?POMO.secsLeft/POMO.totalSecs:1; ring.style.strokeDashoffset=364.4*(1-perc); ring.style.stroke=POMO.mode==='work'?'#e84a2e':'#2bb5a5'; }
  updateTopStats();
}

function aiAnalyze(type){
  var prompts={
    umumiy:'Mening hayot rejam haqida qisqa tahlil bering: '+getDataSummary(),
    vazifalar:'Mening vazifalarim: '+getDataSummary()+' Bugun nimalarga e\'tibor berishim kerak?',
    odatlar:'Mening odatlarim: '+D.habits.map(function(h){ return h.icon+h.name+' (streak:'+h.streak+')'; }).join(', ')+'. Ularni yaxshilash bo\'yicha maslahat bering.',
    maqsadlar:'Mening maqsadlarim: '+D.goals.map(function(g){ return (g.icon||'🎯')+g.title+' ('+g.progress+'%)'; }).join(', ')+'. Progress haqida fikringiz?',
    motivatsiya:'Quyidagi ma\'lumotlar asosida motivatsion xabar yozing: '+getDataSummary()
  };
  callAI(prompts[type]||prompts.umumiy, 'ai-result', 'ai-status');
}
function aiQuestion(){
  var q=document.getElementById('ai-question'); if(!q||!q.value.trim()) return;
  callAI(q.value.trim()+'\n\nMening ma\'lumotlarim: '+getDataSummary(), 'ai-answer', null);
}
function callAI(prompt, resultId, statusId){
  if(statusId){ var s=document.getElementById(statusId); if(s) s.textContent='⏳ Tahlil qilinmoqda...'; }
  var r=document.getElementById(resultId); if(r) r.textContent='...';
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:500,
      messages:[{role:'user',content:prompt+'\n\nO\'zbek tilida qisqa va aniq javob bering. 3-5 jumladan iborat.'}]
    })
  }).then(function(res){ return res.json(); }).then(function(data){
    var text=(data.content||[]).map(function(c){ return c.text||''; }).join('');
    if(r) r.textContent=text||'Javob olinmadi';
    if(statusId){ var s2=document.getElementById(statusId); if(s2) s2.textContent='✅ Tahlil tayyor'; }
  }).catch(function(err){
    if(r) r.textContent='Xatolik: '+err.message;
    if(statusId){ var s3=document.getElementById(statusId); if(s3) s3.textContent='❌ Xato yuz berdi'; }
  });
}
